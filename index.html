<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRO DE ESTUDIANTES - SUPABASE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>REGISTRO DE ESTUDIANTE</h1>
        <p>CRUD con HTML + CSS + JavaScript + Supabase</p>
    </header>
    
    <main>
        <!--FORMULARIO para crear y editar (Insert y el Update)-->
        <section class="tarjeta">
            <h2 id="titulo">Nuevo Estudiante</h2>
            <form id="formulario">
                <input type="hidden" id="id">

                <label for="nombres">Nombres</label>
                <input type="text" id="nombres" required>

                <label for="apellidos">Apellido</label>
                <input type="text" id="apellidos" required>

                <label for="correo">Correo</label>
                <input type="email" id="correo" required>

                <label for="ciclo">Ciclo</label>
                <select id="ciclo" required>
                    <option value="I">I</option>
                    <option value="II">II</option>
                    <option value="III">III</option>
                </select>
                <div class="botones">
                    <button type="submit" id="btnGuardar">Guardar</button>
                    <button type="button" id="btnCancelar" class="gris oculto">Cancelar</button>
                </div>
            </form>
        </section>

        <!-- PARA mostrar los datos guardados en la base de datos  -->
        <section>
            <h2>Lista de estudiantes</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nombres</th>
                        <th>Apellidos</th>
                        <th>Correo</th>
                        <th>Ciclo</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla">
                    <tr><td colspan="5">Cargando...</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- SCRIPT SERA PARA LA LIBRERIA DE SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- PARA EL ARCHIVO JS DONDE ESTAN LAS FUNCIONES PARA EL CRUD -->
    <script src="app.js"></script>
</body>
</html>
